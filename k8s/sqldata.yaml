# sqldata.yaml
# SQL Server 2019 - shared database for StudentsAPI and CoursesAPI
# Uses a PersistentVolumeClaim to retain data across pod restarts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqldata-pvc
  namespace: university
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqldata
  namespace: university
  labels:
    app: sqldata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqldata
  template:
    metadata:
      labels:
        app: sqldata
    spec:
      containers:
        - name: sqldata
          image: mcr.microsoft.com/mssql/server:2019-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: university-secrets, key: SA_PASSWORD }
          volumeMounts:
            - name: sqldata-storage
              mountPath: /var/opt/mssql
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: sqldata-storage
          persistentVolumeClaim:
            claimName: sqldata-pvc
---
# Service exposes SQL Server to other pods via hostname "sqldata" on port 1433
apiVersion: v1
kind: Service
metadata:
  name: sqldata
  namespace: university
spec:
  selector:
    app: sqldata
  ports:
    - port: 1433
      targetPort: 1433
  type: ClusterIP
